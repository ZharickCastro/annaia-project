<section class="tarjeta chat">
  <div class="chat-cabecera tema-espanol">
    <img src="/img/anna.jpeg" alt="Anna IA" class="avatar avatar-sm" />
    <div>
      <strong>Anna IA</strong>
      <small class="estado-linea">Asistente del aula</small>
    </div>
    <button
      type="button"
      class="boton-secundario"
      (click)="consultas.nuevaConversacion()"
      [disabled]="consultas.cargando() || consultas.mensajes().length === 0"
    >
      <app-icono nombre="nueva" /> Nueva consulta
    </button>
  </div>

  <div #registro class="registro">
    @if (consultas.mensajes().length === 0) {
      <div class="vacio">
        <h2>¿Qué quieres aprender?</h2>
        <p class="suave">Escribe tu pregunta o elige una para empezar.</p>
        <div class="preguntas-guia">
          @for (sugerencia of sugerencias; track sugerencia) {
            <button type="button" class="pregunta-guia" (click)="preguntar(sugerencia)">{{ sugerencia }}</button>
          }
        </div>
      </div>
    } @else {
      @for (mensaje of consultas.mensajes(); track $index) {
        <app-mensaje [mensaje]="mensaje" />
      }
    }
  </div>

  <app-campo-pregunta [deshabilitado]="consultas.cargando()" (enviar)="preguntar($event)" />
</section>
