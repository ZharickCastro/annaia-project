<button type="button" class="tarjeta tarjeta-enlace ficha-consulta" (click)="abrir.emit(consulta().id)">
  <span class="insignia"><app-icono nombre="anna" /></span>
  <strong>{{ consulta().pregunta }}</strong>
  <small class="detalle">
    @if (estudiante()) {
      {{ estudiante() }} ·
    }
    {{ consulta().fecha | date: 'd MMM y, h:mm a' }}
    @if (!consulta().respondida) {
      <span class="chip chip-alerta">Sin respuesta</span>
    }
  </small>
  <small class="tiempo">{{ consulta().fecha | tiempoRelativo }}</small>
</button>
